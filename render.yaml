services:
  - type: web
    name: consent-video-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free          # 512MB/free tier is tight for video + ffmpeg; starter is safer
    healthCheckPath: /health
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false        # set this in the Render dashboard, never in git
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ELEVENLABS_STT_MODEL
        value: scribe_v1
      - key: TMP_DIR
        value: /tmp/consent
